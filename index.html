<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple to-do list with persistent storage.">
    <title>Week 7 — To-Do List</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="js/app.js"></script>
</head>
<body>
    <header class="site-header">
        <h1>My To-Do List</h1>
        <button id="theme-toggle" type="button" aria-label="Toggle colour theme">Toggle theme</button>
    </header>
    <main>
        <section aria-labelledby="todo-heading">
            <h2 id="todo-heading">Tasks</h2>
            <form id="todo-form">
                <label for="todo-input">New task</label>
                <input id="todo-input" name="todo" type="text" maxlength="120" required>
                <button type="submit">Add task</button>
            </form>
            <p id="todo-feedback" role="status" aria-live="polite"></p>
            <nav class="filters" aria-label="Filter tasks">
                <button type="button" data-filter="all" aria-pressed="true">All</button>
                <button type="button" data-filter="active" aria-pressed="false">Active</button>
                <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
            </nav>
            <ul id="todo-list" aria-label="Your tasks"></ul>
            <p id="todo-count">0 tasks remaining</p>
        </section>
    </main>
    <footer><p>Week 7 JavaScript Best Practices</p></footer>
</body>
</html>
