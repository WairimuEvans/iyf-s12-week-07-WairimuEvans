<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="cart.js"></script>
</head>
<body>
    <main>
        <header><h1>Kenyan Market</h1><p>Cart items: <strong id="cart-count">0</strong></p></header>
        <section><h2>Products</h2><ul id="products"></ul></section>
        <section><h2>Your cart</h2><ul id="cart-items"></ul><p>Total: KSh <strong id="cart-total">0</strong></p>
            <button id="clear-cart" type="button">Clear cart</button></section>
    </main>
</body>
</html>
