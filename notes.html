<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Notes</title>
    <script type="module" src="notes.js"></script>
</head>
<body>
    <main>
        <h1>Notes</h1>
        <form id="note-form">
            <label for="note-text">Write a note</label>

        <ul id="notes-list"></ul>
    </main>
</body>
</html>
